name: Auto Pull Request

on:
  push:
    branches:
      - '**'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  create-or-update:
    if: github.event.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Create or update pull request
        uses: actions/github-script@v7
        env:
          DEFAULT_REVIEWERS: ${{ vars.DEFAULT_REVIEWERS }}
          DEFAULT_TEAM_REVIEWERS: ${{ vars.DEFAULT_TEAM_REVIEWERS }}
        with:
          script: |
            const { owner, repo } = context.repo
            const base = context.payload.repository.default_branch
            const head = context.ref.replace('refs/heads/', '')
            const actor = context.actor
            const commits = await github.paginate(
              github.rest.repos.compareCommits,
              { owner, repo, base, head, per_page: 100 },
              (response) => response.data.commits,
            )

            if (commits.length === 0) {
              core.info('No commits ahead of the default branch; skipping PR automation.')
              return
            }

            const subject = (commit) => commit.commit.message.split('\n')[0]
            const summary = subject(commits[0])
            const changes = commits
              .map((commit) => `- \`${commit.sha.slice(0, 7)}\` ${subject(commit)}`)
              .join('\n')
            let templateFile
            try {
              templateFile = await github.rest.repos.getContent({
                owner,
                repo,
                path: '.github/pull_request_template.md',
                ref: base,
              })
            } catch (error) {
              if (error.status !== 404) throw error

              templateFile = await github.rest.repos.getContent({
                owner,
                repo,
                path: '.github/pull_request_template.md',
                ref: head,
              })
            }
            const template = Buffer.from(
              templateFile.data.content,
              'base64',
            ).toString('utf8')
            const body = template
              .replace('{{SUMMARY}}', summary)
              .replace('{{CHANGES}}', changes)
            const openPullRequests = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base,
              head: `${owner}:${head}`,
              per_page: 100,
            })
            const pullRequest = openPullRequests[0]
            const pullRequestData = {
              owner,
              repo,
              title: summary,
              body,
            }
            const pullNumber = pullRequest
              ? (
                  await github.rest.pulls.update({
                    ...pullRequestData,
                    pull_number: pullRequest.number,
                  })
                ).data.number
              : (
                  await github.rest.pulls.create({
                    ...pullRequestData,
                    base,
                    head,
                  })
                ).data.number

            await github.rest.issues.addAssignees({
              owner,
              repo,
              issue_number: pullNumber,
              assignees: [actor],
            })

            const reviewers = (process.env.DEFAULT_REVIEWERS || '')
              .split(',')
              .map((reviewer) => reviewer.trim())
              .filter(Boolean)
            const teamReviewers = (process.env.DEFAULT_TEAM_REVIEWERS || '')
              .split(',')
              .map((team) => team.trim())
              .filter(Boolean)

            if (reviewers.length > 0 || teamReviewers.length > 0) {
              await github.rest.pulls.requestReview({
                owner,
                repo,
                pull_number: pullNumber,
                reviewers,
                team_reviewers: teamReviewers,
              })
            }
